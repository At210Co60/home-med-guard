# 复制本文件为 src/main/resources/application-local.yml 后填真实值。
# application-local.yml 已在 .gitignore 中；公有仓库里出现真实密码必须立刻改库并清历史。
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/home_med_guard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: CHANGE_ME

app:
  auth:
    # 生成：openssl rand -base64 32   （没有 openssl 就用 PowerShell: [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Max 256 } | ForEach-Object {[byte]$_}))）
    # 留空会启动失败——不允许用示例密钥上线
    jwt-secret: CHANGE_ME_BASE64_32_BYTES
  crypto:
    # 健康数据字段级加密主密钥，必须正好 32 字节：openssl rand -base64 32
    # 换密钥会让已入库的档案读不出来，所以本地库别共享这个值
    data-key: CHANGE_ME_BASE64_32_BYTES
