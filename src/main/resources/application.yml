server:
  port: 8080

spring:
  application:
    name: home-med-guard
  datasource:
    # 真实密码只放本机 application-local.yml（已 gitignore）或环境变量，绝不写进仓库
    url: ${HMG_DB_URL:jdbc:mysql://127.0.0.1:3306/home_med_guard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${HMG_DB_USER:root}
    password: ${HMG_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.homemedguard
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  module:
    family: true
    drug: true
    stock: true
    expiry: true
    rule: true
    schedule: true
    reminder: true
    forecast: true
    report: true
    admin: true

logging:
  file:
    name: logs/home-med-guard.log
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.homemedguard: INFO

---
# 没装 MySQL 的队友：mvn spring-boot:run -Dspring-boot.run.profiles=h2
# 内存库、Flyway 照常建表，重启即清空；正式环境仍用上面的 MySQL
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: "jdbc:h2:mem:home_med_guard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
