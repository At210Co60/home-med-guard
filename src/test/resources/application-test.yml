spring:
  datasource:
    url: "jdbc:h2:mem:hmg_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true

# 证明模块可以单独关掉而系统照常启动（CONTRIBUTING §6.8）
app:
  module:
    rule: false
    schedule: false

logging:
  level:
    com.homemedguard: WARN
